name: MoonBit compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

jobs:
  probe:
    name: compatibility (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64, minimum compiler
            runner: macos-15
            bundle: 'binaries/0.10.17%2Bd971670cd/moonbit-darwin-aarch64.tar.gz'
            bundle_sha: '39e02f7730486cea54d12e8e781d83a665f245f6a621d01e17a3a13f104eb437'
            core: 'cores/core-0.10.17%2Bd971670cd.tar.gz'
            core_sha: '2d837ecbef5933c09726d63682a7695123d622e6aee13525fbc98c4b49433714'
          - platform: Windows x64, minimum compiler
            runner: windows-2025
            bundle: 'binaries/0.10.17%2Bd971670cd/moonbit-windows-x86_64.zip'
            bundle_sha: '1be9d7f2fb47ec2f4b23cecc7bc3a775361993f07235e59ba5d7da38c5e877de'
            core: 'cores/core-0.10.17%2Bd971670cd.zip'
            core_sha: '80db8f2a2621b3ec358a495c390a0dfbd8ddafdd87a6f69142f069937e2fe40c'
          - platform: Ubuntu x64, stable snapshot
            runner: ubuntu-24.04
            # Verify a fixed version of the stable channel. Refresh both
            # archive digests together when sampling a later stable compiler.
            bundle: 'binaries/0.10.22%2B124d61d05/moonbit-linux-x86_64.tar.gz'
            bundle_sha: 'aeb78ded1d5e25185ed788328cacef5e843a9ab923145523b7652e8d082f74fb'
            core: 'cores/core-0.10.22%2B124d61d05.tar.gz'
            core_sha: 'a22977f3d346e4a189fe521b2d265b2fbb6c00e3ff80342246fb6f8f26c9f156'
    steps:
      - name: Check out workflow commit from public repository
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet
          git fetch --quiet --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify and install official Unix toolchain and core
        if: runner.os != 'Windows'
        env:
          BUNDLE: ${{ matrix.bundle }}
          BUNDLE_SHA: ${{ matrix.bundle_sha }}
          CORE: ${{ matrix.core }}
          CORE_SHA: ${{ matrix.core_sha }}
          MOON_HOME: ${{ runner.temp }}/moonbit-compat
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 "https://cli.moonbitlang.com/$BUNDLE" -o "$RUNNER_TEMP/compat-toolchain.tar.gz"
          curl --fail --location --retry 2 --max-time 180 "https://cli.moonbitlang.com/$CORE" -o "$RUNNER_TEMP/compat-core.tar.gz"
          printf '%s  %s\n%s  %s\n' "$BUNDLE_SHA" "$RUNNER_TEMP/compat-toolchain.tar.gz" "$CORE_SHA" "$RUNNER_TEMP/compat-core.tar.gz" | shasum -a 256 --check
          mkdir -p "$MOON_HOME/lib"
          tar -xzf "$RUNNER_TEMP/compat-toolchain.tar.gz" -C "$MOON_HOME"
          tar -xzf "$RUNNER_TEMP/compat-core.tar.gz" -C "$MOON_HOME/lib"
          chmod +x "$MOON_HOME"/bin/*
          export PATH="$MOON_HOME/bin:$PATH"
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --target js
          moon version --all
          node --version
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
      - name: Verify and install official Windows toolchain and core
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUNDLE: ${{ matrix.bundle }}
          BUNDLE_SHA: ${{ matrix.bundle_sha }}
          CORE: ${{ matrix.core }}
          CORE_SHA: ${{ matrix.core_sha }}
          MOON_HOME: ${{ runner.temp }}/moonbit-compat
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bundle = Join-Path $env:RUNNER_TEMP 'compat-toolchain.zip'
          $core = Join-Path $env:RUNNER_TEMP 'compat-core.zip'
          curl.exe --fail --location --retry 2 --max-time 180 "https://cli.moonbitlang.com/$($env:BUNDLE)" -o $bundle
          curl.exe --fail --location --retry 2 --max-time 180 "https://cli.moonbitlang.com/$($env:CORE)" -o $core
          if ((Get-FileHash $bundle).Hash -ne $env:BUNDLE_SHA -or (Get-FileHash $core).Hash -ne $env:CORE_SHA) {
            throw 'Unexpected toolchain or core archive digest'
          }
          Expand-Archive -LiteralPath $bundle -DestinationPath $env:MOON_HOME
          $lib = Join-Path $env:MOON_HOME 'lib'
          Expand-Archive -LiteralPath $core -DestinationPath $lib
          $bin = Join-Path $env:MOON_HOME 'bin'
          $env:Path = "$bin;$env:Path"
          moon -C (Join-Path $lib 'core') bundle --warn-list -a --target js
          moon version --all
          node --version
          $bin >> $env:GITHUB_PATH
          "MOON_HOME=$env:MOON_HOME" >> $env:GITHUB_ENV
      - name: Check public examples and maintenance boundaries
        shell: bash
        env:
          STABLE_PROBE: ${{ matrix.runner == 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          warning_flags=(--deny-warn)
          if [[ "$STABLE_PROBE" == "true" ]]; then
            # 0.10.17 needs postfix derive. 0.10.22 deprecates it (0027).
            warning_flags+=(--warn-list=-27)
          fi
          moon check --target js "${warning_flags[@]}"
          moon test README.mbt.md maintenance_sequence_test.mbt --target js "${warning_flags[@]}"
