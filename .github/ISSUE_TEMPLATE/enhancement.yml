name: Feature or integration request
description: Describe a use case for the library or a limitation encountered in integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What do you need to do with the sketch? Include the geometry and constraints if relevant.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Current limitation or workaround
      description: Include the library version and target if known. Use only code and data you can share publicly.
    validations:
      required: true
