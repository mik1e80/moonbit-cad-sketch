name: Bug or numerical issue
description: Report a reproducible correctness, geometry, diagnostic, compatibility or documentation issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities privately using the security link in the issue chooser. Use a small example you can share publicly.
  - type: textarea
    id: environment
    attributes:
      label: Package version, compiler, OS and backend
      description: Include the cad_sketch version or commit, moon version --all and the target.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command and minimal code, with initialization, solver options or budget if relevant. For documentation, link the affected page or section.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error, status, report or residuals that help reproduce the issue.
    validations:
      required: true
